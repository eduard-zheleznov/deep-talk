<!doctype html>
<html lang="ru">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>DeepTalk</title>
    </head>
    <body>
        <script type="text/javascript">
            var segmentCount = 1;
            var l = window.location;
            l.replace(
                l.protocol +
                    '//' +
                    l.hostname +
                    (l.port ? ':' + l.port : '') +
                    l.pathname
                        .split('/')
                        .slice(0, 1 + segmentCount)
                        .join('/') +
                    '/?/' +
                    l.pathname
                        .slice(1)
                        .split('/')
                        .slice(segmentCount)
                        .join('/')
                        .replace(/&/g, '~and~') +
                    (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
                    l.hash,
            );
        </script>
    </body>
</html>
